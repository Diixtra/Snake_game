<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Neon Serpent 🐍</title>
  <style>
    :root {
      --bg: #06080f;
      --panel: #0d1220;
      --neon: #39ff88;
      --neon-dim: #1d8a4c;
      --accent: #5ad7ff;
      --danger: #ff4d6d;
      --gold: #ffd84d;
      --text: #d7e4ff;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      touch-action: manipulation; /* no double-tap zoom on buttons */
      background:
        radial-gradient(1200px 600px at 50% -10%, #101a33 0%, var(--bg) 60%);
      color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
    }
    #stage {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: var(--neon);
      text-shadow: 0 0 12px rgba(57, 255, 136, 0.7);
    }
    #frame {
      position: relative;
      border-radius: 12px;
      padding: 8px;
      background: linear-gradient(160deg, rgba(57,255,136,.25), rgba(90,215,255,.15));
      box-shadow: 0 0 40px rgba(57, 255, 136, 0.18);
    }
    canvas {
      display: block;
      border-radius: 8px;
      background: #04060c;
      max-width: calc(100vw - 40px);
      max-height: calc(100vh - 140px);
      touch-action: none; /* swipes steer the snake, never scroll the page */
    }
    #help {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      opacity: 0.75;
      letter-spacing: 1px;
      padding: 0 16px;
      text-align: center;
    }
    .ctl {
      padding: 3px 10px;
      border-radius: 6px;
      border: 1px solid rgba(90, 215, 255, 0.4);
      background: none;
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
    }
    .ctl:active { background: rgba(90, 215, 255, 0.15); }
    /* ---- Quiz overlay ---- */
    #overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(3, 5, 10, 0.82);
      backdrop-filter: blur(4px);
      z-index: 10;
    }
    #overlay.visible { display: flex; }
    .quiz-card {
      width: min(640px, calc(100vw - 32px));
      background: var(--panel);
      border: 1px solid rgba(90, 215, 255, 0.35);
      border-radius: 14px;
      padding: 24px 28px;
      box-shadow: 0 0 60px rgba(90, 215, 255, 0.25);
      animation: card-in 220ms ease-out;
    }
    @keyframes card-in {
      from { transform: translateY(14px) scale(.97); opacity: 0; }
      to   { transform: none; opacity: 1; }
    }
    .quiz-card h2 {
      margin: 0 0 4px;
      font-size: 18px;
      color: var(--danger);
      letter-spacing: 2px;
    }
    .quiz-tier {
      display: inline-block;
      margin-bottom: 12px;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 11px;
      letter-spacing: 2px;
      border: 1px solid var(--accent);
      color: var(--accent);
    }
    .quiz-prompt { margin: 0 0 10px; line-height: 1.45; }
    .quiz-card pre {
      margin: 0 0 14px;
      padding: 12px 14px;
      background: #04060c;
      border: 1px solid rgba(215, 228, 255, 0.12);
      border-radius: 8px;
      color: var(--neon);
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 14px;
      overflow-x: auto;
      white-space: pre;
    }
    .quiz-row { display: flex; gap: 10px; }
    .quiz-row input {
      flex: 1;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid rgba(90, 215, 255, 0.4);
      background: #04060c;
      color: var(--text);
      font-family: Consolas, monospace;
      font-size: 16px; /* below 16px iOS zooms the page when the input focuses */
      outline: none;
    }
    .quiz-row input:focus { border-color: var(--neon); box-shadow: 0 0 10px rgba(57,255,136,.3); }
    .quiz-row button {
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      background: var(--neon);
      color: #03140a;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
    }
    .quiz-row button:hover { filter: brightness(1.15); }
    .quiz-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      font-size: 12px;
      opacity: .8;
    }
    .quiz-giveup {
      background: none;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-size: 12px;
      letter-spacing: 1px;
    }
    .quiz-timer {
      height: 6px;
      margin-top: 14px;
      border-radius: 3px;
      background: rgba(215, 228, 255, 0.12);
      overflow: hidden;
    }
    .quiz-timer > div {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, var(--neon), var(--gold), var(--danger));
      transform-origin: left;
    }
    .quiz-feedback { min-height: 20px; margin-top: 10px; font-size: 14px; }
    .quiz-feedback.ok { color: var(--neon); }
    .quiz-feedback.bad { color: var(--danger); }
  </style>
</head>
<body>
  <div id="stage">
    <h1>Neon Serpent</h1>
    <div id="frame"><canvas id="game" width="800" height="600"></canvas></div>
    <div id="help">
      <span id="help-text">SWIPE or ARROWS/WASD steer · tap or P pause — die and a coding problem can buy your life back</span>
      <button id="btn-mute" class="ctl" type="button" title="mute (M)">🔊</button>
      <button id="btn-restart" class="ctl" type="button" title="restart (R)">↻</button>
    </div>
  </div>
  <div id="overlay"></div>
  <script src="game.js"></script>
</body>
</html>

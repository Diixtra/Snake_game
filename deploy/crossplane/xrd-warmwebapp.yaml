# CompositeResourceDefinition for "warm" web apps on the Diixtra forge.
#
# A WarmWebApp is the opposite of the platform's KEDA scale-to-zero default:
# it always keeps `warmReplicas` pods running so there is never a cold start,
# while still allowing KEDA to scale it UP under load.
#
# Drop this (and composition-warmwebapp.yaml) into the forge alongside the
# other diixtra.io XRDs registered by the infrastructure-crossplane Flux
# Kustomization.
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xwarmwebapps.diixtra.io
spec:
  group: diixtra.io
  names:
    kind: XWarmWebApp
    plural: xwarmwebapps
  claimNames:
    kind: WarmWebApp
    plural: warmwebapps
  defaultCompositionRef:
    name: warmwebapp-kubernetes
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image, host]
              properties:
                image:
                  type: string
                  description: Container image to run (e.g. ghcr.io/jameskazie/snake-game:latest).
                host:
                  type: string
                  description: Hostname Traefik should route to the app (e.g. snake.diixtra.com).
                port:
                  type: integer
                  default: 8080
                  description: Container port serving HTTP traffic.
                warmReplicas:
                  type: integer
                  default: 1
                  minimum: 1
                  description: >-
                    Pre-warmed replica floor. KEDA may scale above this under
                    load but never below it — the app never goes cold.
                maxReplicas:
                  type: integer
                  default: 4
                  description: Upper bound for KEDA scale-out.
                cpu:
                  type: string
                  default: 100m
                memory:
                  type: string
                  default: 128Mi
            status:
              type: object
              properties:
                url:
                  type: string
      additionalPrinterColumns:
        - name: HOST
          type: string
          jsonPath: .spec.host
        - name: WARM
          type: integer
          jsonPath: .spec.warmReplicas

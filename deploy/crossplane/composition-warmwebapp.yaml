# Composition backing the WarmWebApp claim. Composes in-cluster resources via
# provider-kubernetes: a Deployment (with the warm replica floor), a Service,
# a Traefik IngressRoute and a KEDA HTTPScaledObject whose minimum replica
# count equals warmReplicas — warm means "may scale up, never scales to zero".
#
# Requires (already present on the forge): crossplane, provider-kubernetes
# with an `in-cluster` ProviderConfig, function-patch-and-transform, Traefik
# and the KEDA HTTP add-on.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: warmwebapp-kubernetes
  labels:
    diixtra.io/runtime: kubernetes
spec:
  compositeTypeRef:
    apiVersion: diixtra.io/v1alpha1
    kind: XWarmWebApp
  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: deployment
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                providerConfigRef:
                  name: in-cluster
                forProvider:
                  manifest:
                    apiVersion: apps/v1
                    kind: Deployment
                    metadata:
                      namespace: apps
                      labels:
                        diixtra.io/warm: "true"
                    spec:
                      replicas: 1
                      selector:
                        matchLabels: {}
                      template:
                        metadata:
                          labels: {}
                        spec:
                          containers:
                            - name: app
                              image: placeholder
                              ports:
                                - containerPort: 8080
                              readinessProbe:
                                httpGet:
                                  path: /healthz
                                  port: 8080
                                initialDelaySeconds: 2
                              livenessProbe:
                                httpGet:
                                  path: /healthz
                                  port: 8080
                              resources:
                                requests:
                                  cpu: 100m
                                  memory: 128Mi
                                limits:
                                  memory: 256Mi
                              securityContext:
                                allowPrivilegeEscalation: false
                                readOnlyRootFilesystem: false
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.labels[crossplane.io/claim-name]
                toFieldPath: spec.forProvider.manifest.metadata.name
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.labels[crossplane.io/claim-name]
                toFieldPath: spec.forProvider.manifest.spec.selector.matchLabels[app]
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.labels[crossplane.io/claim-name]
                toFieldPath: spec.forProvider.manifest.spec.template.metadata.labels[app]
              - type: FromCompositeFieldPath
                fromFieldPath: spec.image
                toFieldPath: spec.forProvider.manifest.spec.template.spec.containers[0].image
              - type: FromCompositeFieldPath
                fromFieldPath: spec.port
                toFieldPath: spec.forProvider.manifest.spec.template.spec.containers[0].ports[0].containerPort
              - type: FromCompositeFieldPath
                fromFieldPath: spec.port
                toFieldPath: spec.forProvider.manifest.spec.template.spec.containers[0].readinessProbe.httpGet.port
              - type: FromCompositeFieldPath
                fromFieldPath: spec.port
                toFieldPath: spec.forProvider.manifest.spec.template.spec.containers[0].livenessProbe.httpGet.port
              - type: FromCompositeFieldPath
                fromFieldPath: spec.warmReplicas
                toFieldPath: spec.forProvider.manifest.spec.replicas
              - type: FromCompositeFieldPath
                fromFieldPath: spec.cpu
                toFieldPath: spec.forProvider.manifest.spec.template.spec.containers[0].resources.requests.cpu
              - type: FromCompositeFieldPath
                fromFieldPath: spec.memory
                toFieldPath: spec.forProvider.manifest.spec.template.spec.containers[0].resources.requests.memory

          - name: service
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                providerConfigRef:
                  name: in-cluster
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: Service
                    metadata:
                      namespace: apps
                    spec:
                      selector: {}
                      ports:
                        - name: http
                          port: 80
                          targetPort: 8080
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.labels[crossplane.io/claim-name]
                toFieldPath: spec.forProvider.manifest.metadata.name
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.labels[crossplane.io/claim-name]
                toFieldPath: spec.forProvider.manifest.spec.selector[app]
              - type: FromCompositeFieldPath
                fromFieldPath: spec.port
                toFieldPath: spec.forProvider.manifest.spec.ports[0].targetPort

          - name: ingressroute
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                providerConfigRef:
                  name: in-cluster
                forProvider:
                  manifest:
                    apiVersion: traefik.io/v1alpha1
                    kind: IngressRoute
                    metadata:
                      namespace: apps
                    spec:
                      entryPoints: [websecure]
                      routes:
                        - kind: Rule
                          match: Host(`placeholder`)
                          services:
                            - name: placeholder
                              port: 80
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.labels[crossplane.io/claim-name]
                toFieldPath: spec.forProvider.manifest.metadata.name
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.labels[crossplane.io/claim-name]
                toFieldPath: spec.forProvider.manifest.spec.routes[0].services[0].name
              - type: FromCompositeFieldPath
                fromFieldPath: spec.host
                toFieldPath: spec.forProvider.manifest.spec.routes[0].match
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: Host(`%s`)
              - type: ToCompositeFieldPath
                fromFieldPath: spec.forProvider.manifest.spec.routes[0].match
                toFieldPath: status.url

          - name: scaler
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                providerConfigRef:
                  name: in-cluster
                forProvider:
                  manifest:
                    apiVersion: http.keda.sh/v1alpha1
                    kind: HTTPScaledObject
                    metadata:
                      namespace: apps
                    spec:
                      hosts: []
                      scaleTargetRef:
                        name: placeholder
                        kind: Deployment
                        apiVersion: apps/v1
                        service: placeholder
                        port: 80
                      replicas:
                        min: 1
                        max: 4
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.labels[crossplane.io/claim-name]
                toFieldPath: spec.forProvider.manifest.metadata.name
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.labels[crossplane.io/claim-name]
                toFieldPath: spec.forProvider.manifest.spec.scaleTargetRef.name
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.labels[crossplane.io/claim-name]
                toFieldPath: spec.forProvider.manifest.spec.scaleTargetRef.service
              - type: FromCompositeFieldPath
                fromFieldPath: spec.host
                toFieldPath: spec.forProvider.manifest.spec.hosts[0]
              # The whole point of "warm": KEDA's floor is warmReplicas, not zero.
              - type: FromCompositeFieldPath
                fromFieldPath: spec.warmReplicas
                toFieldPath: spec.forProvider.manifest.spec.replicas.min
              - type: FromCompositeFieldPath
                fromFieldPath: spec.maxReplicas
                toFieldPath: spec.forProvider.manifest.spec.replicas.max

# The actual claim for this game. In the forge GitOps flow this file is what
# gets committed (e.g. under apps/base/snake-game/); Flux applies it and
# Crossplane reconciles the Deployment, Service, IngressRoute and warm KEDA
# scaler from the warmwebapp-kubernetes Composition.
apiVersion: diixtra.io/v1alpha1
kind: WarmWebApp
metadata:
  name: snake-game
  namespace: apps
spec:
  image: ghcr.io/jameskazie/snake-game:latest
  host: snake.diixtra.com
  port: 8080
  warmReplicas: 1
  maxReplicas: 3
  cpu: 50m
  memory: 64Mi
